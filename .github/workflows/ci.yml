name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Install CMake and Ninja
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build
      # wasm-opt (binaryen) post-processes the release builds (scripts/build.sh).
      - name: Install binaryen
        env:
          BINARYEN: version_133
        run: |
          base=https://github.com/WebAssembly/binaryen/releases/download/$BINARYEN
          tar=binaryen-$BINARYEN-x86_64-linux.tar.gz
          curl -fsSLO "$base/$tar" -O "$base/$tar.sha256"
          sha256sum -c "$tar.sha256"
          tar xzf "$tar"
          echo "$PWD/binaryen-$BINARYEN/bin" >> "$GITHUB_PATH"
      - uses: Swatinem/rust-cache@v2
      # Builds native libopus, the release and checked wasm2/wasm3 builds, then compares them.
      - name: Test
        run: scripts/test.sh all
      - name: Upload wasm builds
        uses: actions/upload-artifact@v4
        with:
          name: wasm
          path: target/mini*-wasm[23].wasm
